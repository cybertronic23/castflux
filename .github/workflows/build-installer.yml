name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CastFlux-Windows-Setup
          path: |
            dist\CastFlux_Setup*.exe
            docs\WINDOWS_QUICK_START.md
            scripts\vendor\downloads\ffmpeg-release-essentials.zip
            scripts\vendor\wheelhouse\*
          if-no-files-found: warn

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} dist/CastFlux_Setup*.exe docs/WINDOWS_QUICK_START.md scripts/vendor/downloads/ffmpeg-release-essentials.zip --generate-notes
